name: Daily Refresh

on:
  schedule:
    - cron: "0 14 * * *"  # 9:00 AM EDT (UTC-5 winter / UTC-4 summer — adjust cron offset seasonally)
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY1 }}
        run: python main.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json podcast.mp3
          git diff --cached --quiet || git commit -m "chore: daily article refresh"
          git push
